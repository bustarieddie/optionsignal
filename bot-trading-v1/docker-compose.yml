# BOT TRADING v1.0 — full stack (paper mode by default).
# Copy .env.example to .env first. Live trading stays disabled unless you
# explicitly set the env vars AND wire a real live broker adapter.
services:
  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://botuser:botpass@db:5432/botdb
      REDIS_URL: redis://redis:6379/0
    # The backend image only contains ./backend. The config presets and the
    # dashboard live one level up, so mount them read-only at the paths the app
    # resolves at runtime (/config and /dashboard). Also lets you tweak config
    # or dashboard without rebuilding the image.
    volumes:
      - ./config:/config:ro
      - ./dashboard:/dashboard:ro
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: botpass
      POSTGRES_DB: botdb
    volumes:
      - botdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botuser -d botdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  botdb_data:
